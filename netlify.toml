[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# O redireccionamento entre bala.pt e www.bala.pt é feito pela Netlify
# (Domain management → domínio principal). Não duplicar aqui para não criar um ciclo.
